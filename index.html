      "1rTToMF24VpZvTTvBY-GGMqGwzhp5c0YK",

      "1QDOtSBNCleMl7VP_jI5dx4TuNhRYDzSk"

    const key = "stem6_image_index";

    let index = Number(localStorage.getItem(key) || 0);
